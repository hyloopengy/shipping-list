services:
  db:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-packing}
      POSTGRES_USER: ${POSTGRES_USER:-packing}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在.env中设置POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-packing}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-packing}
      SECRET_KEY: ${SECRET_KEY:?请在.env中设置SECRET_KEY}
      PACKING_DATA_DIR: /app/data
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
      TZ: Asia/Shanghai
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8080}:8080"
    volumes:
      - packing-uploads:/app/data

  caddy:
    image: ${CADDY_IMAGE:-caddy:2.10-alpine}
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      SERVER_ADDRESS: ${SERVER_ADDRESS:?请在.env中设置SERVER_ADDRESS}
      BASIC_AUTH_USER: ${BASIC_AUTH_USER:-shipping}
      BASIC_AUTH_HASH: ${BASIC_AUTH_HASH:-请在.env中设置BASIC_AUTH_HASH}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  postgres-data:
  packing-uploads:
  caddy-data:
  caddy-config:
